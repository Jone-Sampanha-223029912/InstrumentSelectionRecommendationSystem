<!DOCTYPE html>
<html>
<head>
    <title>Forgot Account Details</title>

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
>
</head>

<body>

    <div class="container"></div>

    <h1>Forgot Username or Password</h1>

    <p>
        Enter your registered email address.
    </p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    {% if username %}

        <p>
            Your username is:
            <strong>{{ username }}</strong>
        </p>

        <h3>Reset Password</h3>

        <form method="POST">

            <input
                type="hidden"
                name="email"
                value="{{ email }}"
            >

            <input
                type="hidden"
                name="action"
                value="reset"
            >

            <label>New Password:</label>

            <input
                type="password"
                name="new_password"
                required
            >

            <br><br>

            <label>Confirm New Password:</label>

            <input
                type="password"
                name="confirm_password"
                required
            >

            <br><br>

            <button type="submit">
                Reset Password
            </button>

        </form>

    {% else %}

        <form method="POST">

            <input
                type="hidden"
                name="action"
                value="find"
            >

            <label>Email:</label>

            <input
                type="email"
                name="email"
                required
            >

            <br><br>

            <button type="submit">
                Find Account
            </button>

        </form>

    {% endif %}

    <br>

    <a href="/login">Back to Login</a>

</body>
</html>
