<!DOCTYPE html>
<html>
<head>
    <title>Add Instrument</title>

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
>
</head>

<body>

    <div class="container"></div>

    <h1>Add Instrument</h1>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <label>Instrument Name:</label>
        <input type="text" name="instrument_name" required>

        <br><br>

        <label>Type:</label>
        <input type="text" name="type">

        <br><br>

        <label>Difficulty:</label>

        <select name="difficulty_level" required>
            <option value="Easy">Easy</option>
            <option value="Medium">Medium</option>
            <option value="Hard">Hard</option>
        </select>

        <br><br>

        <label>Category:</label>

        <select name="category_id" required>

            {% for category in categories %}

                <option value="{{ category.category_id }}">
                    {{ category.category_name }}
                </option>

            {% endfor %}

        </select>

        <br><br>

        <label>Minimum Price:</label>
        <input type="number" name="min_price" min="0" step="0.01">

        <br><br>

        <label>Noise Level:</label>

        <select name="noise_level">
            <option value="">Not Specified</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
        </select>

        <br><br>

        <label>
            <input type="checkbox" name="headphone_support">
            Headphone Support
        </label>

        <br><br>

        <label>
            <input type="checkbox" name="portable">
            Portable
        </label>

        <br><br>

        <label>Recommended Practice Minutes:</label>
        <input type="number" name="practice_minutes" min="1">

        <br><br>

        <label>Description:</label>
        <br>

        <textarea
            name="description"
            rows="4"
            cols="40"
        ></textarea>

        <br><br>

        <button type="submit">Add Instrument</button>

    </form>

    <br>

    <a href="/admin/instruments">Cancel</a>

</body>
</html>
