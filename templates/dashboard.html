<!DOCTYPE html>
<html>
<head>

    <title>Dashboard</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="container">

        <h1>Dashboard</h1>

        <h2>Welcome, {{ first_name }}!</h2>

        <p>
            Logged in as:
            <strong>{{ username }}</strong>
        </p>

        <hr>

        <h3>Menu</h3>

        <div class="menu">

            <a class="button" href="/profile">
                My Profile
            </a>

            <a class="button" href="/preferences">
                My Preferences
            </a>

            <a class="button" href="/instruments">
                Search Instruments
            </a>

            <a class="button" href="/recommendations">
                Get Recommendations
            </a>

            {% if role == "Admin" %}

                <a class="button" href="/admin">
                    Admin
                </a>

            {% endif %}

        </div>

        <br>

        <a href="/logout">Logout</a>

    </div>

</body>
</html>
